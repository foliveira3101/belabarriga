name: Deploy

on:
  push:
    branches: [master]

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '10.0.x'

jobs:
  # ─────────────────────────────────────────────
  # Frontend: build → deploy to Azure Static Web Apps
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Azure Static Web Apps
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # pre-built — skip SWA's own build
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true

  # ─────────────────────────────────────────────
  # Backend: build → publish → deploy to Azure App Service
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Azure App Service
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build & publish
        run: >
          dotnet publish src/BelaBarriga.Api/BelaBarriga.Api.csproj
          --configuration Release
          --output ./publish
          --no-restore
        working-directory: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          package: backend/publish
