name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/BelaBarriga.Api.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-results.trx" --results-directory TestResults

      - name: Integration tests
        run: dotnet test tests/BelaBarriga.Api.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx" --results-directory TestResults
        env:
          ASPNETCORE_ENVIRONMENT: Test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/TestResults/
          retention-days: 7
